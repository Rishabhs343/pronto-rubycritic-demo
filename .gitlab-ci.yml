image: ruby:3.3

stages:
  - lint

variables:
  BUNDLE_PATH: vendor/bundle
  BUNDLE_JOBS: '4'

cache:
  key:
    files:
      - Gemfile
  paths:
    - vendor/bundle

before_script:
  - apt-get update -qq && apt-get install -yq cmake libgit2-dev git jq curl
  - gem install bundler --no-document
  - bundle install

pronto:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  interruptible: true          # newest MR push cancels any in-flight run
  variables:
    PRONTO_RUBYCRITIC_SEVERITY_LEVEL: warning
    PRONTO_GITLAB_API_ENDPOINT: $CI_API_V4_URL
  script:
    # 1. Delete every note/discussion from a previous pronto-rubycritic run
    #    so the MR shows only the latest output.
    - bash scripts/cleanup-previous-mr-notes.sh
    # 2. Refresh the git-sourced gem so we always have the latest pronto-rubycritic.
    - bundle update pronto-rubycritic
    # 3. Run pronto against the diff.
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - bundle exec pronto run -r rubycritic
        -c "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        -f gitlab_mr
