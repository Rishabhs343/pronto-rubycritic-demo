# Filter which smells pronto-rubycritic reports on PR lines.
# All keys are optional — with no file at all, every smell on every
# added/changed line is reported at :warning severity.

reek:
  smell_types:
    - FeatureEnvy
    - LongParameterList
    - DuplicateMethodCall
    - UncommunicativeMethodName
    - UncommunicativeVariableName
  max_smells: 5

flay:
  max_score: 100
  exclude:
    - 'spec/**/*'

flog:
  max_score: 20
  exclude:
    - 'spec/**/*'

complexity:
  max: 15

churn:
  max: 10
