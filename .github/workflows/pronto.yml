name: Pronto

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

# Only one CI run per PR — the newest push supersedes any in-flight run.
# Combined with the cleanup step below, every comment on the PR is always
# from the most recent run.
concurrency:
  group: pronto-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pronto:
    name: pronto-rubycritic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Delete every comment + review from any prior pronto-rubycritic run so
      # the PR shows ONLY the output of the current run. Identified by the
      # unique brand URL in the comment footer so it can't accidentally match
      # a human-authored comment that happens to mention the tool.
      - name: Clean up previous pronto-rubycritic output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:    ${{ github.repository }}
          PR:      ${{ github.event.pull_request.number }}
          BRAND:   'https://github.com/Rishabhs343/custom-pronto-gem'
        run: |
          set -euo pipefail
          echo "Cleaning up any previous pronto-rubycritic output on PR #$PR…"

          # Inline review comments (attached to a specific line of the diff)
          for id in $(gh api --paginate "repos/$REPO/pulls/$PR/comments" \
                        --jq ".[] | select(.body | contains(\"$BRAND\")) | .id"); do
            echo "  - delete inline comment #$id"
            gh api --method DELETE "repos/$REPO/pulls/comments/$id" --silent || true
          done

          # Conversation-level issue comments
          for id in $(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                        --jq ".[] | select(.body | contains(\"$BRAND\")) | .id"); do
            echo "  - delete issue comment #$id"
            gh api --method DELETE "repos/$REPO/issues/comments/$id" --silent || true
          done

          # Pending reviews (from the github_pr formatter)
          for id in $(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
                        --jq ".[] | select(.body | contains(\"$BRAND\")) | .id"); do
            echo "  - dismiss review #$id"
            gh api --method PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
              -f message="Superseded by run ${{ github.run_id }}" --silent || true
          done

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Refresh git-sourced pronto-rubycritic
        run: bundle update pronto-rubycritic

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Run pronto-rubycritic
        env:
          PRONTO_PULL_REQUEST_ID:          ${{ github.event.pull_request.number }}
          PRONTO_GITHUB_ACCESS_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          PRONTO_RUBYCRITIC_SEVERITY_LEVEL: warning
        run: |
          bundle exec pronto run \
            -r rubycritic \
            -c origin/${{ github.base_ref }} \
            -f github_pr github_status
